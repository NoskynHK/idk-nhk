<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASCII Video Easter Egg</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Torna alla GameHub -->
    <a href="URL_DELLA_TUA_PROJECT_HUB" class="back-btn">← Torna alla GameHub</a>

    <!-- Overlay dell'Easter Egg -->
    <div class="ascii-overlay">
        <button id="play-pause-btn" onclick="togglePlay()">▶ Avvia / Pausa</button>
        <!-- Schermata dove scorrerà l'ASCII in tempo reale -->
        <pre id="ascii-screen"></pre>
    </div>

    <!-- Video sorgente nascosto e Audio sincronizzato -->
    <video id="source-video" src="tuo-video.mp4" preload="auto" loop crossorigin="anonymous" style="display:none;"></video>
    <audio id="source-audio" src="tua-canzone.mp3" preload="auto" loop crossorigin="anonymous"></audio>

    <script src="script.js"></script>
</body>
</html>
